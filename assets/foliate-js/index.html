<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Modu</title>
<style>
  html {
    height: 100vh;
    overflow: hidden;
  }

  body {
    user-select: none;
    margin: 0 !important;
    height: 100vh;  
  }


  #footnote-dialog {
    /*
    padding: var(safe-area-inset-top) var(safe-area-inset-right) var(safe-area-inset-bottom) var(safe-area-inset-left);
    */
    position: fixed;
    width: 0;
    height: 0;
    min-width: 0;
    min-height: 0;
    box-sizing: border-box;
    padding: 8px;
    margin: 0;
    overflow: hidden;
    border-radius: 15px;
    border: 1px solid grey;
    user-select: none;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    outline: none;
    z-index: 1000;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
  }

  #footnote-dialog main {
    /* The embedded renderer owns the note's writing-direction-aware scroll. */
    overflow: hidden;
    width: 100%;
    height: 100%;
  }
  #footnote-dialog main > foliate-view {
    display: block;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
  }
</style>
<div id="footnote-dialog">
  <main></main>
</div>
<script>
  // Prevent the default WebView2 right-click context menu on Windows.
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
</script>
<script src="./reader-bootstrap.js"></script>
