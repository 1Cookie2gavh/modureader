// Keep Chromium's native selection handles when the reader replaces only the
// menu buttons with its Flutter toolbar. Upstream finishes ActionMode, which
// hides the handles and can reset our expanded range to the original glyph.
// Compile a generated copy; never mutate the shared Pub cache.
project(':flutter_inappwebview_android').afterEvaluate { webviewProject ->
    def upstream = webviewProject.file('src/main/java')
    def webview = new File(upstream,
            'com/pichillilorenzo/flutter_inappwebview_android/webview/in_app_webview/InAppWebView.java')
    def anchor = 'Menu actionMenu = actionMode.getMenu();'
    def generated = webviewProject.layout.buildDirectory.dir('generated/moduReaderSelection/java')
    def patchTask = webviewProject.tasks.register('prepareModuReaderSelection', Sync) {
        inputs.property('moduSelectionHandlesPolicy', 5)
        from(upstream) {
            filesMatching('**/webview/in_app_webview/InAppWebView.java') {
                filter { String line ->
                    if (line.startsWith('final public class InAppWebView extends ')) {
                        return line + '''
  public boolean moduRendererGone = false;

  private ActionMode.Callback moduReaderActionCallback(final ActionMode.Callback callback) {
    if (customSettings.disableContextMenu || contextMenu == null) return callback;
    Object options = contextMenu.get("settings");
    Object items = contextMenu.get("menuItems");
    WebView.HitTestResult hit = getHitTestResult();
    if (hit != null && hit.getType() == WebView.HitTestResult.EDIT_TEXT_TYPE) return callback;
    if (!(options instanceof Map) ||
        !Boolean.TRUE.equals(((Map<?, ?>) options).get("hideDefaultSystemContextMenuItems")) ||
        !(items == null || (items instanceof List && ((List<?>) items).isEmpty()))) return callback;
    return new ActionMode.Callback2() {
      @Override
      public boolean onCreateActionMode(ActionMode mode, Menu menu) {
        boolean created = callback.onCreateActionMode(mode, menu);
        // Clear before Android can lay out the floating toolbar, not after super returns.
        menu.clear();
        return created;
      }
      @Override
      public boolean onPrepareActionMode(ActionMode mode, Menu menu) {
        boolean changed = callback.onPrepareActionMode(mode, menu);
        boolean hadItems = menu.size() > 0;
        menu.clear();
        return changed || hadItems;
      }
      @Override
      public boolean onActionItemClicked(ActionMode mode, android.view.MenuItem item) {
        return callback.onActionItemClicked(mode, item);
      }
      @Override
      public void onDestroyActionMode(ActionMode mode) {
        callback.onDestroyActionMode(mode);
      }
      @Override
      public void onGetContentRect(ActionMode mode, View view, android.graphics.Rect rect) {
        if (callback instanceof ActionMode.Callback2) {
          ((ActionMode.Callback2) callback).onGetContentRect(mode, view, rect);
        } else {
          super.onGetContentRect(mode, view, rect);
        }
      }
    };
  }

  private static Context moduReaderContext(Context context, InAppWebViewSettings settings,
                                          Map<String, Object> menu) {
    if (settings.disableContextMenu || menu == null) return context;
    Object options = menu.get("settings");
    Object items = menu.get("menuItems");
    if (options instanceof Map &&
        Boolean.TRUE.equals(((Map<?, ?>) options).get("hideDefaultSystemContextMenuItems")) &&
        (items == null || (items instanceof List && ((List<?>) items).isEmpty()))) {
      // Match the reader handles before the asynchronous JS selection bridge runs.
      return new android.view.ContextThemeWrapper(context, R.style.ModuReaderSelection);
    }
    return context;
  }'''
                    }
                    if (line.trim() == 'super(context, containerView, customSettings.useHybridComposition);') {
                        return '    super(moduReaderContext(context, customSettings, contextMenu), containerView, customSettings.useHybridComposition);'
                    }
                    if (line.trim() == 'return rebuildActionMode(super.startActionMode(callback), callback);') {
                        return '    return rebuildActionMode(super.startActionMode(moduReaderActionCallback(callback)), callback);'
                    }
                    if (line.trim() == 'return rebuildActionMode(super.startActionMode(callback, type), callback);') {
                        return '    return rebuildActionMode(super.startActionMode(moduReaderActionCallback(callback), type), callback);'
                    }
                    if (line.trim() == 'loadUrl("about:blank");') {
                        return '''    // A crashed renderer cannot finish an about:blank navigation.
    if (moduRendererGone) {
      ViewParent parent = getParent();
      if (parent instanceof ViewGroup) ((ViewGroup) parent).removeView(this);
      destroy();
    } else {
      loadUrl("about:blank");
    }'''
                    }
                    if (line.trim() != anchor) return line
                    return '''    // Modu reader: suppress menu buttons, not the native selection UI.
    if (!customSettings.disableContextMenu && contextMenu != null) {
      Object settings = contextMenu.get("settings");
      Object items = contextMenu.get("menuItems");
      if (settings instanceof Map &&
          Boolean.TRUE.equals(((Map<?, ?>) settings).get("hideDefaultSystemContextMenuItems")) &&
          (items == null || (items instanceof List && ((List<?>) items).isEmpty()))) {
        // Do not run hide(3000) or finish(): keep the first native selection UI.
        actionMode.getMenu().clear();
        sendOnCreateContextMenuEvent();
        return actionMode;
      }
    }
''' + line
                }
            }
            filesMatching(['**/webview/in_app_webview/InAppWebViewClient.java',
                           '**/webview/in_app_webview/InAppWebViewClientCompat.java']) {
                filter { String line ->
                    if (line.trim() != 'public boolean onRenderProcessGone(WebView view, RenderProcessGoneDetail detail) {') return line
                    return line + '\n    ((InAppWebView) view).moduRendererGone = true;'
                }
            }
        }
        into(generated)
        doFirst {
            def source = webview.getText('UTF-8')
            if (source.readLines().count { it.trim() == 'loadUrl("about:blank");' } != 1 ||
                    source.readLines().count { it.trim() == 'super(context, containerView, customSettings.useHybridComposition);' } != 1 ||
                    source.readLines().count { it.startsWith('final public class InAppWebView extends ') } != 1) {
                throw new GradleException('WebView disposal changed; review renderer recovery before building')
            }
            ['InAppWebViewClient.java', 'InAppWebViewClientCompat.java'].each { name ->
                def client = new File(webview.parentFile, name).getText('UTF-8')
                if (client.readLines().count { it.trim() == 'public boolean onRenderProcessGone(WebView view, RenderProcessGoneDetail detail) {' } != 1) {
                    throw new GradleException('WebView renderer callback changed; review recovery before building')
                }
            }
            if (source.readLines().count { it.trim() == anchor } != 1 ||
                    source.readLines().count { it.trim() == 'return rebuildActionMode(super.startActionMode(callback), callback);' } != 1 ||
                    source.readLines().count { it.trim() == 'return rebuildActionMode(super.startActionMode(callback, type), callback);' } != 1 ||
                    !source.contains('actionMenu.clear();\n    actionMode.finish();')) {
                throw new GradleException('WebView ActionMode changed; review Modu selection handles before building')
            }
        }
    }
    webviewProject.android.sourceSets.main.java.setSrcDirs([generated])
    webviewProject.android.sourceSets.main.res.srcDir(rootProject.file('reader-selection-res'))
    webviewProject.tasks.named('preBuild').configure { dependsOn(patchTask) }
}
