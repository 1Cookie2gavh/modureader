// Compile a narrowly patched copy, NEVER modify the shared Pub cache.
// audio_service has no Dart option for silent notification updates. Keep the
// upstream implementation/resources and fail closed when these anchors change.
project(':audio_service').afterEvaluate { audioProject ->
        def upstream = audioProject.file('src/main/java')
        def service = new File(upstream, 'com/ryanheise/audioservice/AudioService.java')
        def builderAnchor = '.setShowWhen(false)'
        def channelAnchor = 'channel.setShowBadge(config.androidShowNotificationBadge);'
        // Flutter forwards --dart-define as base64 Gradle properties. Ordinary
        // builds do not opt into the experimental compact layout.
        // Android 13+ vivo/iQOO play routing and stop fixes are enabled in release.
        def defines = (rootProject.findProperty('dart-defines') ?: '').split(',')
            .findAll { it }.collect { new String(it.decodeBase64(), 'UTF-8') }
        def iqooTest = defines.contains('MODU_IQOO_MEDIA_COMPAT=true')
        def classAnchor = 'public class AudioService extends MediaBrowserServiceCompat {'
        def customAnchor = 'customActions.add(customAction);'
        def compactAnchor = 'if (Build.VERSION.SDK_INT < 33) {'
        def stopAnchor = 'public void stop() {'
        def playAnchor = 'listener.onPlay();'
        def bypassPlayAnchor = 'public static final int KEYCODE_BYPASS_PLAY = KeyEvent.KEYCODE_MUTE;'
        def receiver = new File(upstream, 'com/ryanheise/audioservice/MediaButtonReceiver.java')
        def receiveAnchor = 'super.onReceive(context, intent);'
        def generated = audioProject.layout.buildDirectory.dir('generated/moduAudioService/java')
        def patchTask = audioProject.tasks.register('prepareModuSilentAudioService', Sync) {
            inputs.property('moduSilentNotificationPolicy', 1)
            inputs.property('moduIqooMediaCompat', iqooTest)
            inputs.property('moduIqooMediaCompatRevision', 4)
            from(rootProject.file('audio_service/ModuNotificationPlay.java')) {
                into('com/ryanheise/audioservice')
            }
            from(rootProject.file('audio_service/ModuMediaNotificationPolicy.java')) {
                into('com/ryanheise/audioservice')
                filter { String line ->
                    line.replace('TEST_BUILD = false;', "TEST_BUILD = ${iqooTest};")
                }
            }
            from(upstream) {
                filesMatching('**/MediaButtonReceiver.java') {
                    filter { String line ->
                        if (line.trim() == receiveAnchor) {
                            return '        if (AudioService.instance != null && ModuNotificationPlay.handle(' +
                                '\n                context, intent, AudioService.instance.getSessionToken())) return;' +
                                '\n' + line
                        }
                        return line
                    }
                }
                filesMatching('**/AudioService.java') {
                    filter { String line ->
                        if (line.trim() == playAnchor) {
                            return '            if (moduPlayCompatEnabled()) ModuMediaNotificationPolicy.sessionPlayCallbacks++;' +
                                '\n' + line
                        }
                        if (line.trim() == classAnchor) {
                            return line + '\n    public static boolean moduMediaCompatEnabled() {' +
                                '\n        return ModuMediaNotificationPolicy.enabled(ModuMediaNotificationPolicy.TEST_BUILD, Build.BRAND, Build.MANUFACTURER);' +
                                '\n    }' +
                                '\n    public static boolean moduPlayCompatEnabled() {' +
                                '\n        return ModuMediaNotificationPolicy.playActionEnabled(ModuMediaNotificationPolicy.TEST_BUILD, Build.VERSION.SDK_INT, Build.BRAND, Build.MANUFACTURER);' +
                                '\n    }' +
                                '\n    public static boolean moduStopCompatEnabled() {' +
                                '\n        return ModuMediaNotificationPolicy.stopActionEnabled(Build.VERSION.SDK_INT, Build.BRAND, Build.MANUFACTURER);' +
                                '\n    }'
                        }
                        if (line.trim() == customAnchor) {
                            // Keep the modern session custom stop action, and
                            // also provide it to the legacy notification layout.
                            return line + '\n                if (moduStopCompatEnabled() && control.actionCode == PlaybackStateCompat.ACTION_STOP) {' +
                                '\n                    nativeActions.add(createAction(control.icon, control.label, control.actionCode));' +
                                '\n                }'
                        }
                        if (line.trim() == compactAnchor) {
                            return '        if (Build.VERSION.SDK_INT < 33 || moduMediaCompatEnabled()) {'
                        }
                        if (line.trim() == stopAnchor) {
                            // A bound service may outlive stopSelf. Remove the
                            // old foreground card now, not only in onDestroy.
                            return line + '\n        if (moduStopCompatEnabled()) {' +
                                '\n            notificationCreated = false;' +
                                '\n            legacyStopForeground(true);' +
                                '\n            getNotificationManager().cancel(NOTIFICATION_ID);' +
                                '\n            releaseWakeLock();' +
                                '\n        }'
                        }
                        if (line.trim() == builderAnchor) {
                            return line + '\n                    .setSilent(true)' +
                                '\n                    .setOnlyAlertOnce(true)' +
                                '\n                    .setDefaults(0)' +
                                '\n                    .setSound(null)' +
                                '\n                    .setVibrate(null)'
                        }
                        if (line.trim() == channelAnchor) {
                            return line + '\n            channel.setSound(null, null);' +
                                '\n            channel.enableVibration(false);'
                        }
                        return line
                    }
                }
            }
            into(generated)
            doFirst {
                def lines = service.readLines('UTF-8').collect { it.trim() }
                if (lines.count(builderAnchor) != 1 || lines.count(channelAnchor) != 1) {
                    throw new GradleException('audio_service notification code changed; review Modu silent policy before building')
                }
                if ([classAnchor, customAnchor, compactAnchor, stopAnchor, playAnchor, bypassPlayAnchor].any { lines.count(it) != 1 } ||
                        receiver.readLines('UTF-8').count { it.trim() == receiveAnchor } != 1) {
                    throw new GradleException('audio_service media controls changed; review iQOO compatibility before building')
                }
            }
        }
        audioProject.android.sourceSets.main.java.setSrcDirs([generated])
        audioProject.tasks.named('preBuild').configure { dependsOn(patchTask) }
}
