name: hf_tokenizers
description: >-
  HuggingFace tokenizers for Dart over FFI. Load any tokenizer.json and get
  byte-exact BPE, WordPiece, and Unigram encoding, backed by the Rust crate.
version: 1.2.1
repository: https://github.com/Yusufihsangorgel/tokenizers
topics:
  - llm
  - ai
  - tokenizer
  - ffi
  - nlp

# Publication screenshots are omitted from this local source-only copy.
platforms:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.10.0

dependencies:
  ffi: ^2.1.0
  hooks: '>=2.0.2 <3.0.0'
  code_assets: ^2.0.0

dev_dependencies:
  # example/rag_chunking.dart only. Pure Dart with no runtime dependencies,
  # so it costs consumers nothing.
  rag_kit: ^1.0.2
  crypto: ^3.0.0
  lints: ^6.0.0
  test: ^1.25.0

